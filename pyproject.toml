[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-intelligence-engine"
version = "0.1.0"
description = "Local, offline, persistent index of Python repositories"
requires-python = ">=3.12"

[project.optional-dependencies]
web = ["playwright==1.64.1"]

[project.scripts]
pie = "pie.interfaces.cli:main"
pie-setup = "pie.interfaces.setup:main"
pie-mcp = "pie.interfaces.mcp_server:main"
pie-gateway = "pie.interfaces.gateway:main"
pie-blender-mcp = "pie.integrations.blender_mcp_bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

