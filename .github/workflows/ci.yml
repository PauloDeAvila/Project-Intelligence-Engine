name: Validation Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter-tests:
    name: Starter Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v

  web-contracts:
    name: Web Contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dependency-free web contract tests
        run: python -m unittest discover -s tests/web -v
      - name: Compile web subsystem
        run: python -m compileall -q src/pie/web tests/web

  project-verification:
    name: Project Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build backend
        run: python -m pip install --disable-pip-version-check "setuptools>=68"
      - name: Compile source and tests
        run: python -m compileall -q src tools tests
      - name: Run project-specific full verification matrix (fail closed)
        run: python tools/verify_project.py
      - name: Run reproducible performance baseline
        run: python tools/benchmark_index.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-linux
          path: verification-results.json
          if-no-files-found: warn

  windows-compatibility:
    name: Windows Compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build backend
        run: python -m pip install --disable-pip-version-check "setuptools>=68"
      - name: Compile source and tests
        run: python -m compileall -q src tools tests
      - name: Run project-specific full verification matrix (fail closed)
        run: python tools/verify_project.py
      - name: Run reproducible performance baseline
        run: python tools/benchmark_index.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-windows
          path: verification-results.json
          if-no-files-found: warn
