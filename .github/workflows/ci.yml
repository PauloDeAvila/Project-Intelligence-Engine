name: Validation Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  starter-tests:
    name: Starter Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v

  web-contracts:
    name: Web Contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dependency-free web contract tests
        run: python -m unittest discover -s tests/web -v
      - name: Compile web subsystem
        run: python -m compileall -q src/pie/web tests/web

  web-connector:
    name: Web Connector (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned web extra
        run: python -m pip install --disable-pip-version-check ".[web]"
      - name: Install Chromium with Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: matrix.os == 'windows-latest'
        run: python -m playwright install chromium
      - name: Run deterministic connector unit tests
        run: python -m unittest discover -s tests/web -p "test_browser.py" -v
      - name: Run local HTTP browser integration tests
        run: python -m unittest discover -s tests/web -p "test_browser_integration.py" -v
      - name: Run connector performance baseline
        run: python tools/benchmark_web_connector.py --repetitions 3
      - name: Upload connector evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-connector-evidence-${{ matrix.os }}
          path: web-connector-benchmark.json
          if-no-files-found: error
      - name: Compile web subsystem
        run: python -m compileall -q src/pie/web tests/web

  web-page-intelligence:
    name: Web Page Intelligence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned web extra
        run: python -m pip install --disable-pip-version-check ".[web]"
      - name: Install Chromium with Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: matrix.os == 'windows-latest'
        run: python -m playwright install chromium
      - name: Run deterministic page intelligence tests
        run: python -m unittest discover -s tests/web -p "test_snapshots.py" -v
      - name: Run local browser snapshot integration tests
        run: python -m unittest discover -s tests/web -p "test_snapshots_integration.py" -v
      - name: Compile web subsystem
        run: python -m compileall -q src/pie/web tests/web
      - name: Create page intelligence evidence summary
        if: always()
        run: python -c "import json,platform,sys; json.dump({'job':'web-page-intelligence','os':platform.platform(),'python':sys.version.split()[0],'tests':['test_snapshots.py','test_snapshots_integration.py'],'contains_raw_page_data':False},open('web-page-intelligence-evidence.json','w',encoding='utf-8'),indent=2)"
      - name: Upload page intelligence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-page-intelligence-evidence-${{ matrix.os }}
          path: web-page-intelligence-evidence.json
          if-no-files-found: error

  web-search-index:
    name: Web Search Index (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic local search tests
        run: python -m unittest discover -s tests/web -p "test_indexing.py" -v
      - name: Run local search benchmark
        run: python tools/benchmark_web_search.py --repetitions 100 --output web-search-benchmark.json
      - name: Upload search benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-search-index-evidence-${{ matrix.os }}
          path: web-search-benchmark.json
          if-no-files-found: error
      - name: Compile web subsystem
        run: python -m compileall -q src/pie/web tests/web tools/benchmark_web_search.py

  web-relevance-gate:
    name: Web Relevance Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic relevance tests
        run: python -m unittest discover -s tests/web -p "test_relevance.py" -v
      - name: Run relevance benchmark
        run: python tools/benchmark_web_relevance.py --repetitions 100 --output web-relevance-benchmark.json
      - name: Upload relevance benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-relevance-gate-evidence-${{ matrix.os }}
          path: web-relevance-benchmark.json
          if-no-files-found: error
      - name: Compile web subsystem
        run: python -m compileall -q src/pie/web tests/web tools/benchmark_web_relevance.py

  web-security-gate:
    name: Web Security Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic security gate tests
        run: python -m unittest tests.web.test_security -v
      - name: Compile web security subsystem
        run: python -m compileall -q src/pie/web/security tests/web/test_security.py

  web-evidence-packs:
    name: Web Evidence Packs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic evidence pack tests
        run: python -m unittest tests.web.test_evidence -v
      - name: Compile web evidence subsystem
        run: python -m compileall -q src/pie/web/evidence tests/web/test_evidence.py

  web-action-engine:
    name: Web Action Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic action engine tests
        run: python -m unittest tests.web.test_actions -v
      - name: Compile web action subsystem
        run: python -m compileall -q src/pie/web/actions tests/web/test_actions.py

  web-fast-path:
    name: Web Fast Path (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic optimization tests
        run: python -m unittest tests.web.test_optimization -v
      - name: Run fast path benchmark
        run: python tools/benchmark_web_fast_path.py --repetitions 1000 --output web-fast-path-benchmark.json
      - name: Upload fast path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-fast-path-evidence-${{ matrix.os }}
          path: web-fast-path-benchmark.json
          if-no-files-found: error
      - name: Compile web optimization subsystem
        run: python -m compileall -q src/pie/web/optimization tests/web/test_optimization.py tools/benchmark_web_fast_path.py

  project-verification:
    name: Project Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build backend
        run: python -m pip install --disable-pip-version-check "setuptools>=68"
      - name: Compile source and tests
        run: python -m compileall -q src tools tests
      - name: Run project-specific full verification matrix (fail closed)
        run: python tools/verify_project.py
      - name: Run reproducible performance baseline
        run: python tools/benchmark_index.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-linux
          path: verification-results.json
          if-no-files-found: warn

  windows-compatibility:
    name: Windows Compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build backend
        run: python -m pip install --disable-pip-version-check "setuptools>=68"
      - name: Compile source and tests
        run: python -m compileall -q src tools tests
      - name: Run project-specific full verification matrix (fail closed)
        run: python tools/verify_project.py
      - name: Run reproducible performance baseline
        run: python tools/benchmark_index.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-windows
          path: verification-results.json
          if-no-files-found: warn
