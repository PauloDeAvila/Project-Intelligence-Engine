name: PIE - Index Generation and Invalidation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/pie/retrieval/warm.py'
      - 'tests/test_pie_index_generation.py'
      - '.github/workflows/pie-index-generation.yml'
permissions:
  contents: read
jobs:
  consistency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Validate consistency and background invalidation
        run: python -m unittest discover -s tests -p "test_pie_index_generation.py" -v
      - name: Check previous warm daemon regressions
        run: python -m unittest discover -s tests -p "test_pie_warm_service.py" -v
      - name: Measure warm latency
        run: python tools/pie_warm_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-generation-${{ matrix.os }}
          path: pie-warm-gate.json
          if-no-files-found: warn
