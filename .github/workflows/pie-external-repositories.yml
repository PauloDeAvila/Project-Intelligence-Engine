name: PIE - external repositories benchmark
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/pie/**'
      - 'tools/pie_multi_repo_benchmark.py'
      - '.github/workflows/pie-external-repositories.yml'
permissions:
  contents: read
jobs:
  external-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout independent public repositories
        run: |
          mkdir -p external
          git clone --depth 1 https://github.com/Textualize/rich.git external/rich
          git clone --depth 1 https://github.com/pallets/flask.git external/flask
          git clone --depth 1 https://github.com/pallets/click.git external/click
          for name in rich flask click; do
            echo "$name $(git -C external/$name rev-parse HEAD)"
          done
      - name: Benchmark PIE against real Python source trees
        run: |
          python tools/pie_multi_repo_benchmark.py \
            --repos external/rich external/flask external/click \
            --questions 10 --repeats 7 --output pie-multi-repo-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pie-external-repositories-results
          path: pie-multi-repo-results.json
          if-no-files-found: warn
