name: PIE - 9Router cloud gateway check

on:
  push:
    branches: [main, feat/cloud-9router-benchmark-gateway]
    paths:
      - '.github/workflows/pie-gateway-check.yml'
      - 'tools/cloud_gateway_probe.py'
      - 'tools/cloud_pie_benchmark.py'
  workflow_dispatch:
    inputs:
      model:
        description: "Exact 9Router model identifier"
        required: true
        default: "gh/gpt-4o-mini"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: pie-gateway-benchmark
  cancel-in-progress: true

jobs:
  gateway-check:
    name: Verify cloud access to 9Router
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PIE_API_BASE_URL: ${{ secrets.PIE_API_BASE_URL || vars.PIE_API_BASE_URL || 'https://fixtures-deaths-icq-disks.trycloudflare.com' }}
      PIE_API_KEY: ${{ secrets.PIE_API_KEY }}
      TARGET_MODEL: ${{ inputs.model || 'gh/gpt-4o-mini' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test one model request
        shell: bash
        run: python tools/cloud_gateway_probe.py
      - name: Run three-way PIE benchmark after successful gateway test
        shell: bash
        run: |
          python -m compileall -q src tools/cloud_pie_benchmark.py tools/pie_causal_selector.py
          PYTHONPATH=src python -m unittest discover -s tests -q
          PYTHONPATH=src python tools/cloud_pie_benchmark.py --dry-run --out benchmark-results
          PYTHONPATH=src python tools/cloud_pie_benchmark.py --model "$TARGET_MODEL" --repeats 1 --out benchmark-results
      - name: Publish benchmark summary on PR
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("benchmark-results/summary.json")
          if not p.is_file():
              Path("benchmark-summary.md").write_text("### Automatic PIE cloud benchmark\n\nThe experiment stopped before a complete summary was produced. Review the Actions step logs and available evidence artifact. No speedup is claimed.\n",encoding="utf-8")
              raise SystemExit(0)
          data=json.loads(p.read_text(encoding="utf-8"))
          rows=[]
          for name,rec in data.get("summary",{}).items():
              rows.append(f"| {name} | {rec['n']} | {rec['median_latency_s']} | {rec['total_tokens']} | {rec['nonstop']} |")
          body=(
              "### Automatic PIE cloud benchmark\n\n"
              "Model: `"+data.get("model","unknown")+"`\n\n"
              "| Mode | Successful calls | Median seconds | Total tokens | Non-stop finishes |\n"
              "|---|---:|---:|---:|---:|\n" + "\n".join(rows)+
              "\n\n**Interpretation:** pilot only; no automatic semantic correctness verdict. "
              "The curated_reference condition uses question-specific source selection and is not a deployable PIE algorithm. "
              "Raw answers and evidence are preserved as Actions artifacts.\n"
          )
          Path("benchmark-summary.md").write_text(body,encoding="utf-8")
          PY
          if [ -f benchmark-summary.md ]; then gh pr comment 7 --body-file benchmark-summary.md; fi
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pie-benchmark-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-check-${{ github.run_id }}
          path: gateway-check.json
          if-no-files-found: warn
          retention-days: 7
