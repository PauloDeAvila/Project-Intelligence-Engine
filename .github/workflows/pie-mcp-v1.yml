name: PIE - MCP v1 Integration
on:
  push:
    branches: [feat/pie-context-intelligence-v2]
    paths:
      - 'src/pie/interfaces/mcp_server.py'
      - 'src/pie/interfaces/setup.py'
      - 'pyproject.toml'
      - 'tests/test_pie_install_mcp.py'
      - 'src/pie/interfaces/mcp_context.py'
      - 'src/pie/retrieval/warm.py'
      - 'src/pie/retrieval/context.py'
      - 'src/pie/retrieval/intelligence.py'
      - 'src/pie/retrieval/packs.py'
      - 'tests/test_pie_mcp_v1.py'
      - '.github/workflows/pie-mcp-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PIE
        run: python -m pip install -e .
      - name: MCP protocol and persistent retrieval tests
        run: python -m unittest discover -s tests -p test_pie_mcp_v1.py -v
      - name: Install and multi-workspace registration tests
        run: python -m unittest discover -s tests -p test_pie_install_mcp.py -v
      - name: Installed package smoke test
        run: python tools/check_install.py
      - name: Existing MCP and warm-service regression tests
        run: python -m unittest discover -s tests -p test_pie_warm_service.py -v
