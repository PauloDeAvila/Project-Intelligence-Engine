name: PIE - NVIDIA API five-call benchmark
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Exact NVIDIA model ID exposed by 9Router (required)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pie-nvidia-five-call-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIE_API_BASE_URL: ${{ secrets.PIE_API_BASE_URL || vars.PIE_API_BASE_URL }}
      PIE_API_KEY: ${{ secrets.PIE_API_KEY }}
      MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and controlled zero-call preflight
        shell: bash
        run: |
          python -m compileall -q src tools/cloud_pie_benchmark.py
          PYTHONPATH=src python tools/cloud_pie_benchmark.py \
            --dry-run --model "$MODEL" --repeats 1 \
            --cases MAX_RETRIES,release \
            --modes baseline,pie_rtk \
            --max-calls 5 --cooldown-seconds 10 \
            --out benchmark-results
      - name: Execute strictly bounded inference
        shell: bash
        run: |
          PYTHONPATH=src python tools/cloud_pie_benchmark.py \
            --model "$MODEL" --repeats 1 \
            --cases MAX_RETRIES,release \
            --modes baseline,pie_rtk \
            --max-calls 5 --cooldown-seconds 10 \
            --out benchmark-results
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pie-nvidia-five-call-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 14
          if-no-files-found: warn
