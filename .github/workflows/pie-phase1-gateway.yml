name: PIE Phase 1 Gateway Evidence

on:
  push:
    branches:
      - "feat/pie-phase1-global-rtk-mcp-gateway-*"
  pull_request:
    paths:
      - "src/pie/gateway/**"
      - "tests/test_pie_phase1_gateway.py"
      - "tools/benchmark_phase1_gateway.py"
      - "pyproject.toml"
      - ".github/workflows/pie-phase1-gateway.yml"

permissions:
  contents: read

jobs:
  phase1-gateway:
    name: Phase 1 gateway (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PIE editable package
        run: python -m pip install -e .
      - name: Run Phase 1 gateway unit and stdio integration tests
        run: python -m unittest discover -s tests -p test_pie_phase1_gateway.py -v
      - name: Run deterministic character and recovery gate
        run: python tools/benchmark_phase1_gateway.py --output phase1-benchmark.json
      - name: Upload reproducible report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-gateway-${{ matrix.os }}
          path: phase1-benchmark.json
          if-no-files-found: warn
