name: PIE Groq 5x5 (manual)
on:
  workflow_dispatch:
    inputs:
      model:
        description: Groq model ID
        required: true
        default: qwen/qwen3-32b
        type: string

permissions:
  contents: read

concurrency:
  group: pie-groq-5x5
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Groq secret
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Missing repository secret GROQ_API_KEY"
            exit 1
          fi
      - name: Install PIE
        run: python -m pip install -e .
      - name: Index checked-out repository
        run: |
          python -m pie index --root .
          python -m pie status --root .
      - name: Compare exactly five questions in both conditions
        run: python tools/groq_5x5.py --model "${{ inputs.model }}"
      - name: Upload result even when calls fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pie-groq-5x5-results
          path: pie-groq-5x5-results.json
          if-no-files-found: warn
