name: PIE - Responsibility Context Packs Gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/pie/retrieval/packs.py'
      - 'src/pie/retrieval/warm.py'
      - 'tests/test_pie_responsibility_packs.py'
      - '.github/workflows/pie-context-packs.yml'
permissions:
  contents: read
jobs:
  packs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Responsibility pack contract
        run: python -m unittest discover -s tests -p "test_pie_responsibility_packs.py" -v
      - name: Verified graph regression
        run: python -m unittest discover -s tests -p "test_pie_verified_graph.py" -v
      - name: Warm service regression
        run: python -m unittest discover -s tests -p "test_pie_warm_service.py" -v
