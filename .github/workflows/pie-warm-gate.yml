name: PIE - Warm Context Gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/pie/retrieval/warm.py'
      - 'src/pie/retrieval/intelligence.py'
      - 'src/pie/indexing/**'
      - 'src/pie/storage/**'
      - 'src/pie/retrieval/fts.py'
      - 'tests/test_pie_warm_service.py'
      - 'tools/pie_warm_gate.py'
      - '.github/workflows/pie-warm-gate.yml'
permissions:
  contents: read
jobs:
  correctness-and-latency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PIE
        run: python -m pip install -e .
      - name: Run daemon regression tests
        run: python -m unittest discover -s tests -p "test_pie_warm_service.py" -v
      - name: Measure warmed cache and verify invalidation
        run: python tools/pie_warm_gate.py
      - name: Publish benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pie-warm-gate-${{ matrix.os }}
          path: pie-warm-gate.json
          if-no-files-found: warn
