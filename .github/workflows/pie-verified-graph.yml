name: PIE - Verified Graph Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pie/graph/verified.py'
      - 'src/pie/retrieval/warm.py'
      - 'tests/test_pie_verified_graph.py'
      - '.github/workflows/pie-verified-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Graph identity and stale-source regression
        run: python -m unittest discover -s tests -p "test_pie_verified_graph.py" -v
      - name: Warm context regression
        run: python -m unittest discover -s tests -p "test_pie_warm_service.py" -v
