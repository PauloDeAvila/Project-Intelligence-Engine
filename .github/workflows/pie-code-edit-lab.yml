name: PIE - executable code edit A/B lab
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/pie_code_edit_lab.py'
      - '.github/workflows/pie-code-edit-lab.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIE_API_BASE_URL: ${{ secrets.PIE_API_BASE_URL }}
      PIE_API_KEY: ${{ secrets.PIE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile generation harness
        run: python -m compileall -q tools/pie_code_edit_lab.py
      - name: Ask GPT for code edits without executing model output
        run: python -u tools/pie_code_edit_lab.py --mode generate --output generation.json
      - name: Retain raw model outputs without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pie-edit-generations
          path: generation.json
  verify:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pie-edit-generations
      - name: Pull isolated Python execution image
        run: docker pull python:3.12-slim
      - name: Verify untrusted patches in locked-down containers without API secrets
        run: python -u tools/pie_code_edit_lab.py --mode verify --input generation.json --output code-edit-results.json
      - name: Publish executable test findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pie-edit-executable-results
          path: code-edit-results.json
