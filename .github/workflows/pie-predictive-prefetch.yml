name: PIE - Predictive Prefetch Gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/pie/retrieval/predictive.py'
      - 'src/pie/retrieval/warm.py'
      - 'tests/test_pie_predictive_prefetch.py'
      - '.github/workflows/pie-predictive-prefetch.yml'
permissions:
  contents: read
jobs:
  predictive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Predictive prefetch contracts
        run: python -m unittest discover -s tests -p "test_pie_predictive_prefetch.py" -v
      - name: Context packs
        run: python -m unittest discover -s tests -p "test_pie_responsibility_packs.py" -v
      - name: Verified graph
        run: python -m unittest discover -s tests -p "test_pie_verified_graph.py" -v
