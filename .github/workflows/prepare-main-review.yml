name: Prepare Production Review

on:
  push:
    branches: [revisao]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Open production review PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list --repo "$REPO" --head revisao --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --repo "$REPO" --head revisao --base main \
              --title "Release reviewed changes to main" \
              --body "Final review gate. Require CI, independent impact review and explicit approval for this exact commit. Never auto-merge to main."
          else
            echo "Production PR #$PR_NUMBER already open."
          fi
